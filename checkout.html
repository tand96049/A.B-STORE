<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout | A.B Store</title><link rel="stylesheet" href="css/style.css"></head><body><header class="header"><div class="container nav"><a href="index.html" class="logo">A.B <span>STORE</span></a><nav class="menu"><a href="index.html">Home</a><a href="products.html">Products</a><a href="track-order.html">Track Order</a><a href="login.html">Account</a></nav><div class="nav-actions"><a href="cart.html" class="cart-btn">🛒 Cart <span id="cartCount">0</span></a><button class="burger" id="burgerBtn" type="button" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button></div></div></header><main class="page-main"><div class="container"><div class="page-intro"><div><p class="kicker">SECURE CHECKOUT</p><h1>Finish your order</h1><p>Enter your details below. This demo stores no payment information.</p></div></div><div class="content-grid"><form class="panel" data-checkout><h2>Delivery details</h2><div class="form-grid"><div class="field"><label for="name">Full name</label><input id="name" required></div><div class="field"><label for="email">Email</label><input id="email" type="email" required></div><div class="field full"><label for="address">Address</label><input id="address" required></div><div class="field"><label for="city">City</label><input id="city" required></div><div class="field"><label for="zip">Postal code</label><input id="zip" required></div></div><div class="form-actions"><button class="btn primary" type="submit">Place order</button></div><p class="notice" data-checkout-message></p></form><aside class="panel"><h2>Payment</h2><p class="notice">Payment is simulated for this local storefront preview. No card details are collected.</p></aside></div></div></main><script src="js/app.js"></script><script src="js/checkout.js"></script></body></html>
